<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>メールを確認する</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <h1>メールを確認する</h1>
  <p>メールに届いた確認コードを入れます。Floci に届いたメールは <a href="http://localhost:4566/_aws/ses" target="_blank">http://localhost:4566/_aws/ses</a> で読めます。</p>

  <form id="confirm">
    <label>ユーザー名 <input name="username" required></label>
    <label>確認コード <input name="code" inputmode="numeric" required></label>
    <button>確認する</button>
  </form>

  <section>
    <h2>Cognito の応答</h2>
    <pre id="output">まだ何もしていません</pre>
  </section>

  <p><a href="./">トップへ</a></p>

  <script type="module">
    import { client, config, formValues, show, ConfirmSignUpCommand } from './cognito.js';

    // サインアップの画面から来たときは、ユーザー名を入れておく
    document.querySelector('#confirm [name=username]').value = new URLSearchParams(location.search).get('username') ?? '';

    document.querySelector('#confirm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const { username, code } = formValues(event.target);
      try {
        const result = await client.send(new ConfirmSignUpCommand({ ClientId: config.clientId, Username: username, ConfirmationCode: code }));
        show('ConfirmSignUp', result);
      } catch (error) {
        show('ConfirmSignUp', error);
      }
    });
  </script>
</body>
</html>
