<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>届いたメール</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 0.4rem; text-align: left; vertical-align: top; }
  </style>
</head>
<body>
  <h1>届いたメール</h1>
  <p>Floci は、Cognito が送るメールを実際には送らず、手元にためておきます。新しいものが上です。</p>
  <button id="reload">読み込み直す</button>

  <table>
    <thead><tr><th>日時</th><th>宛先</th><th>件名</th><th>本文</th></tr></thead>
    <tbody id="mails"></tbody>
  </table>

  <p><a href="./confirm.html">メールを確認する</a> ・ <a href="./">トップへ</a></p>

  <script type="module">
    import { cognitoEndpoint } from './cognito.js';

    async function load() {
      // Floci にたまったメールの一覧（Floci だけの機能。本物の Cognito には無い）
      const { messages } = await (await fetch(`${cognitoEndpoint}/_aws/ses`)).json();
      const tbody = document.querySelector('#mails');
      tbody.replaceChildren(...messages.reverse().map((m) => {
        const tr = document.createElement('tr');
        for (const text of [new Date(m.Timestamp).toLocaleString(), m.Destination.ToAddresses.join(', '), m.Subject, m.Body.text_part]) {
          const td = document.createElement('td');
          td.textContent = text;
          tr.append(td);
        }
        return tr;
      }));
    }

    document.querySelector('#reload').addEventListener('click', load);
    await load();
  </script>
</body>
</html>
