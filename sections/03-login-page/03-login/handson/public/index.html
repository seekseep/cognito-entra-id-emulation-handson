<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cognito ログインの練習</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <h1>Cognito ログインの練習</h1>
  <p id="status">ログインしていません</p>
  <p>Cognito の API: <code id="endpoint">読み込み中…</code></p>
  <p><a href="./signup.html">サインアップ</a> ・ <a href="./confirm.html">メールを確認する</a></p>

  <form id="login">
    <h2>パスワードでログイン</h2>
    <label>ユーザー名 <input name="username" required></label>
    <label>パスワード <input name="password" type="password" required></label>
    <button>ログイン</button>
  </form>

  <section>
    <h2>ID トークンの中身</h2>
    <pre id="id-token">ログインすると表示します</pre>
    <button id="logout">ログアウト</button>
  </section>

  <section>
    <h2>Cognito の応答</h2>
    <pre id="output">まだ何もしていません</pre>
  </section>

  <script type="module" src="./main.js"></script>
</body>
</html>
