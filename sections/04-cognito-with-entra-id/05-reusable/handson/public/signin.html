<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>サインイン</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <h1>サインイン</h1>

  <form id="signin">
    <label>ユーザー名 <input name="username" required></label>
    <label>パスワード <input name="password" type="password" required></label>
    <button>サインイン</button>
    <p class="message"></p>
  </form>

  <section>
    <h2>ほかの方法でサインイン</h2>
    <button id="entra-login">Entra ID でサインイン</button>
  </section>

  <p><a href="./">トップへ</a></p>

  <script type="module">
    import { client, config, formValues, showMessage, showError, saveTokens, InitiateAuthCommand } from './cognito.js';
    import { hostedLogin } from './cognito.js';

    document.querySelector('#signin').addEventListener('submit', async (event) => {
      event.preventDefault();
      const { username, password } = formValues(event.target);
      try {
        const result = await client.send(new InitiateAuthCommand({
          ClientId: config.clientId,
          AuthFlow: 'USER_PASSWORD_AUTH',
          AuthParameters: { USERNAME: username, PASSWORD: password },
        }));
        // 管理者が作ったユーザーの初回サインインなどでは、トークンの代わりにチャレンジ（ChallengeName）が返る
        const auth = result.AuthenticationResult;
        if (!auth) return showMessage(event.target, `続けるには追加の手続きが要ります（${result.ChallengeName}）`, { error: true });
        saveTokens({ idToken: auth.IdToken, accessToken: auth.AccessToken, refreshToken: auth.RefreshToken });
        location.assign('./home.html');
      } catch (error) {
        showError(event.target, error);
      }
    });

    // Cognito に登録した IdP の名前（register-entra.sh の --provider-name）を渡す
    document.querySelector('#entra-login').addEventListener('click', () => hostedLogin('EntraID'));
  </script>
</body>
</html>
