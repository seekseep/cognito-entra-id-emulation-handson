services:
  floci:
    image: docker.io/floci/floci:2.4.0
    ports:
      # ほかのマシンから届かないよう、ループバックにだけ公開する（Floci は認証なしで API を受け付ける）
      - "127.0.0.1:4566:4566"
    environment:
      # 画面（http://localhost:3000）から Cognito の API を直接呼べるようにする
      FLOCI_SECURITY_EXTRA_CORS_ALLOWED_ORIGINS: http://localhost:3000
    healthcheck:
      # イメージに curl も grep も無いので、bash の /dev/tcp で叩いて 1 行目のステータスだけを見る
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4566 && printf 'GET /_floci/health HTTP/1.0\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]"]
      interval: 3s
      timeout: 3s
      retries: 20

  entra-local:
    # amd64 向けのイメージしか無い。Apple Silicon の Mac ではエミュレーションで動く（起動に少し時間がかかる）
    image: ghcr.io/cmaneu/entra-local:0.1.1
    platform: linux/amd64
    environment:
      # Floci はコンテナの中から entra-local を呼ぶ。自己署名証明書を信頼させる手間を省くため、練習では HTTP にする
      TLS_ENABLED: "false"
      # discovery やトークンの iss に載る URL。ブラウザから見える名前にそろえる
      PUBLIC_ORIGIN: http://localhost:8443
      # 既定はアカウントを選ぶだけでサインインできる。本物に近づけるため、パスワードを求める
      REQUIRE_PASSWORD: "true"
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      # ユーザーやアプリ登録は SQLite に残る（podman compose down でも消えない）。消したいときは podman compose down -v
      - entra-local-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8443/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      # エミュレーションの下では node の起動だけで数秒かかる。間に合わずに unhealthy にならないよう長めに取る
      interval: 5s
      timeout: 15s
      start_period: 60s
      retries: 30

volumes:
  entra-local-data:
