services:
  floci:
    image: docker.io/floci/floci:2.4.0
    ports:
      # ほかのマシンから届かないよう、ループバックにだけ公開する（Floci は認証なしで API を受け付ける）
      - "127.0.0.1:4566:4566"
    healthcheck:
      # イメージに curl も grep も無いので、bash の /dev/tcp で叩いて 1 行目のステータスだけを見る
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4566 && printf 'GET /_floci/health HTTP/1.0\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]"]
      interval: 3s
      timeout: 3s
      retries: 20
