<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cognito ログインの練習</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 44rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
    form, section { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    input { display: block; margin: 0.25rem 0 0.75rem; padding: 0.4rem; width: 100%; box-sizing: border-box; }
    button { margin: 0 0.5rem 0.5rem 0; }
    pre { background: #f4f4f4; padding: 0.75rem; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Cognito ログインの練習</h1>
  <!-- @since 03-03 -->
  <p id="status">ログインしていません</p>
  <!-- @end -->
  <p>Cognito の API: <code id="endpoint">読み込み中…</code></p>
  <!-- @since 03-04 -->

  <section>
    <h2>Hosted UI でログイン</h2>
    <p>ログイン先: <code id="authorize">読み込み中…</code></p>
    <button id="hosted-login">Cognito のログイン画面へ</button>
    <!-- @since 05-04 -->
    <button id="entra-login">Entra ID でログイン</button>
    <!-- @end -->
  </section>
  <!-- @end -->
  <!-- @since 03-02 -->

  <form id="signup">
    <h2>サインアップ</h2>
    <label>ユーザー名 <input name="username" required></label>
    <label>メール <input name="email" type="email" required></label>
    <label>パスワード <input name="password" type="password" required></label>
    <button>登録する</button>
  </form>

  <form id="confirm">
    <h2>確認コード</h2>
    <p>Floci に届いたメールは <a href="http://localhost:4566/_aws/ses" target="_blank">http://localhost:4566/_aws/ses</a> で読めます。</p>
    <label>ユーザー名 <input name="username" required></label>
    <label>確認コード <input name="code" inputmode="numeric" required></label>
    <button>確認する</button>
  </form>
  <!-- @end -->
  <!-- @since 03-03 -->

  <form id="login">
    <h2>パスワードでログイン</h2>
    <label>ユーザー名 <input name="username" required></label>
    <label>パスワード <input name="password" type="password" required></label>
    <button>ログイン</button>
  </form>

  <section>
    <h2>ID トークンの中身</h2>
    <pre id="id-token">ログインすると表示します</pre>
    <button id="logout">ログアウト</button>
  </section>
  <!-- @end -->
  <!-- @since 03-02 -->

  <section>
    <h2>Cognito の応答</h2>
    <pre id="output">まだ何もしていません</pre>
  </section>
  <!-- @end -->

  <script type="module" src="./main.js"></script>
</body>
</html>
