<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>サインアップ</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <h1>サインアップ</h1>

  <form id="signup">
    <label>ユーザー名 <input name="username" required></label>
    <label>メール <input name="email" type="email" required></label>
    <label>パスワード <input name="password" type="password" required></label>
    <button>登録する</button>
  </form>

  <section>
    <h2>Cognito の応答</h2>
    <pre id="output">まだ何もしていません</pre>
  </section>

  <p><a href="./">トップへ</a></p>

  <script type="module">
    import { client, config, formValues, show, SignUpCommand } from './cognito.js';

    document.querySelector('#signup').addEventListener('submit', async (event) => {
      event.preventDefault();
      const { username, email, password } = formValues(event.target);
      try {
        const result = await client.send(new SignUpCommand({
          ClientId: config.clientId,
          Username: username,
          Password: password,
          UserAttributes: [{ Name: 'email', Value: email }],
        }));
        // @until 03-04
        show('SignUp', result);
        // @end
        // @since 03-04
        // 登録できたら、メールに届いた確認コードを入れる画面へ
        location.assign(`./confirm.html?username=${encodeURIComponent(username)}`);
        // @end
      } catch (error) {
        show('SignUp', error);
      }
    });
  </script>
</body>
</html>
