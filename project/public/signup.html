<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>サインアップ</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <h1>サインアップ</h1>

  <form id="signup">
    <label>ユーザー名 <input name="username" required></label>
    <label>メール <input name="email" type="email" required></label>
    <label>パスワード <input name="password" type="password" required></label>
    <button disabled>登録する</button>
    <p class="message"></p>
  </form>

  <p><a href="./">トップへ</a></p>

  <script type="module">
    import { client, config, formValues, showError, SignUpCommand } from './cognito.js';

    document.querySelector('#signup').addEventListener('submit', async (event) => {
      event.preventDefault();
      const { username, email, password } = formValues(event.target);
      try {
        await client.send(new SignUpCommand({
          ClientId: config.clientId,
          Username: username,
          Password: password,
          UserAttributes: [{ Name: 'email', Value: email }],
        }));
        // 登録できたら、メールに届いた確認コードを入れる画面へ
        location.assign(`./confirm.html?username=${encodeURIComponent(username)}`);
      } catch (error) {
        showError(event.target, error);
      }
    });

    // スクリプトの準備ができてから押せるようにする（その前に押すと、ブラウザがフォームをふつうに送り、パスワードが URL に載ってしまう）
    document.querySelector('#signup button').disabled = false;
  </script>
</body>
</html>
